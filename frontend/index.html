      rel="stylesheet"
    />
    <script>
      // Apply saved theme and language before first paint (no flash).
      try {
        var theme = localStorage.getItem('olimp.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var lang = localStorage.getItem('olimp.lang');
        if (lang === 'ky' || lang === 'ru') document.documentElement.lang = lang;
      } catch (e) {}
    </script>
